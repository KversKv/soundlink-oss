[package]
name = "soundlink"
version = "0.1.0"
edition = "2021"
description = "SoundLink 桌面接收端（Tauri 2 + Rust 核心）"
license = "MIT"
rust-version = "1.80"

[lib]
name = "soundlink_lib"
path = "src/lib.rs"

[[bin]]
name = "soundlink"
path = "src/main.rs"

# QR-1：elevated 辅助进程（EDID 写入/设备重启/看门狗/救援还原）。
# 仅随 tauri_app 构建（需要 windows crate 完整 feature 集）。
[[bin]]
name = "qr_helper"
path = "src/bin/qr_helper.rs"
required-features = ["tauri_app"]

# QR-1 M0：平台能力探针 CLI（枚举/NVAPI/EDID/带宽实测）。
[[bin]]
name = "qr_probe"
path = "src/bin/qr_probe.rs"
required-features = ["tauri_app"]

[features]
default = []
# 启用真实 libopus（需 cmake + C 编译器； vendored libopus 1.5）。
opus = ["dep:libopus_sys"]
# 启用 Tauri 应用外壳（需 MSVC Build Tools + WebView2）。
# 自动启用 opus（生产环境必须用真实 libopus，否则解码回退 passthrough 产生噪声）。
# 自动启用 wasapi：Windows GUI 模式下发送端默认用 WASAPI Loopback 采集系统音频
# （非 Windows 平台 wasapi feature 为 no-op，windows crate 有 target 门控。
#   Windows 端 `cargo check --no-default-features --features tauri_app` 已验证；
#   macOS/Linux 真机构建待 G1/G2/G3 阶段验证）。
tauri_app = ["dep:tauri", "dep:tauri-build", "dep:dirs", "dep:tauri-plugin-opener", "dep:tauri-plugin-autostart", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-window-state", "dep:tauri-plugin-global-shortcut", "opus", "wasapi", "dep:qr-edid", "dep:qr-bandwidth", "dep:qr-ipc", "dep:zip"]
# 启用 Windows WASAPI Loopback 采集（阶段 5，仅 Windows）。
wasapi = ["dep:windows"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
parking_lot = "0.12"
rand = "0.8"
rand_core = "0.6"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
cpal = "0.15"
base64 = "0.22"
# mDNS 服务发现（阶段 3）：广播 _soundlink._udp.local.
mdns-sd = "0.11"
# open-core 能力边界（MON-01 阶段 Q）：恒定 path 依赖，无 feature、无 optional。
# 构建免费版还是 Pro 版由 desktop/pro/ 目录内容决定（公开免费实现 / 私有实现检出覆盖）。
soundlink-pro-api = { path = "../pro-api" }
soundlink-pro = { path = "../pro" }
# QR-1 分辨率快速切换（Pro）：纯逻辑 crates，随 tauri_app 启用（Windows 平台代码在该 feature 下编译）。
qr-edid = { path = "crates/qr-edid", optional = true }
qr-bandwidth = { path = "crates/qr-bandwidth", optional = true }
qr-ipc = { path = "crates/qr-ipc", optional = true }
# QR-1 M9：诊断包导出（zip）。
zip = { version = "2", optional = true, default-features = false, features = ["deflate"] }
# 本机局域网 IPv4 枚举（配对码卡片显示本机地址用）。
local-ip-address = "0.6"
libopus_sys = { version = "0.3", optional = true }
tauri = { version = "2", optional = true, features = ["tray-icon", "image-png"] }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-window-state = { version = "2", optional = true }
tauri-plugin-global-shortcut = { version = "2", optional = true }
dirs = { version = "5", optional = true }
# OS keyring：Ed25519 私钥 / 固定配对码安全存储（阶段 A 安全红线修复）。
# keyring v3 默认不启用任何平台 backend，必须显式指定 native feature，
# 否则 Entry::new / get_secret / set_secret 会静默失败（长期码丢失根因）。
keyring = { version = "3", features = [
    "windows-native",
    "apple-native",
    "linux-native-sync-persistent",
] }

# Windows WASAPI Loopback 采集（阶段 5）。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", optional = true, features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_System_Com",
    "Win32_Devices_Properties",
    # MON-01 R3：读取 HKLM\SOFTWARE\Microsoft\Cryptography\MachineGuid 计算设备指纹。
    "Win32_System_Registry",
    # QR-1 分辨率快速切换（Pro）：显示枚举/切换/EDID/helper IPC。
    "Win32_Graphics_Gdi",
    "Win32_Devices_Display",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_WinTrust",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
] }

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }
# E1：build.rs 注入构建日期到环境变量。
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3"

[[example]]
name = "loopback_sender"
path = "examples/loopback_sender.rs"

[[example]]
name = "control_loopback"
path = "examples/control_loopback.rs"

[[example]]
name = "phase4_loopback"
path = "examples/phase4_loopback.rs"

[[example]]
name = "phase5_loopback"
path = "examples/phase5_loopback.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
