[package]
name = "soundlink"
version = "0.1.0"
edition = "2021"
description = "SoundLink 桌面接收端（Tauri 2 + Rust 核心）"
license = "MIT"
rust-version = "1.80"

[lib]
name = "soundlink_lib"
path = "src/lib.rs"

[[bin]]
name = "soundlink"
path = "src/main.rs"

[features]
default = []
# 启用真实 libopus（需 cmake + C 编译器； vendored libopus 1.5）。
opus = ["dep:libopus_sys"]
# 启用 Tauri 应用外壳（需 MSVC Build Tools + WebView2）。
# 自动启用 opus（生产环境必须用真实 libopus，否则解码回退 passthrough 产生噪声）。
# 自动启用 wasapi：Windows GUI 模式下发送端默认用 WASAPI Loopback 采集系统音频
# （非 Windows 平台 wasapi feature 为 no-op，windows crate 有 target 门控）。
tauri_app = ["dep:tauri", "dep:tauri-build", "dep:dirs", "dep:tauri-plugin-opener", "dep:tauri-plugin-autostart", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-window-state", "opus", "wasapi"]
# 启用 Windows WASAPI Loopback 采集（阶段 5，仅 Windows）。
wasapi = ["dep:windows"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
parking_lot = "0.12"
rand = "0.8"
rand_core = "0.6"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
cpal = "0.15"
base64 = "0.22"
# mDNS 服务发现（阶段 3）：广播 _soundlink._udp.local.
mdns-sd = "0.11"
libopus_sys = { version = "0.3", optional = true }
tauri = { version = "2", optional = true, features = ["tray-icon", "image-png"] }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-window-state = { version = "2", optional = true }
dirs = { version = "5", optional = true }
# OS keyring：Ed25519 私钥 / 固定配对码安全存储（阶段 A 安全红线修复）。
keyring = "3"

# Windows WASAPI Loopback 采集（阶段 5）。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", optional = true, features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_System_Com",
    "Win32_Devices_Properties",
] }

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }
# E1：build.rs 注入构建日期到环境变量。
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]

[[example]]
name = "loopback_sender"
path = "examples/loopback_sender.rs"

[[example]]
name = "control_loopback"
path = "examples/control_loopback.rs"

[[example]]
name = "phase4_loopback"
path = "examples/phase4_loopback.rs"

[[example]]
name = "phase5_loopback"
path = "examples/phase5_loopback.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
