    <meta name="description" content="SoundLink 是面向头戴式耳机用户的局域网音频流转软件。手机音频经局域网加密发送到电脑，由电脑输出到高品质音频设备。免费、开源、零遥测。" />

    <script>
      // 首访按浏览器语言建议跳转到英文入口（记住用户选择，不强制）
      (function () {
        try {
          var saved = localStorage.getItem('soundlink-lang');
          if (saved === 'en') location.replace('/SoundLink/en/');
          else if (!saved && navigator.language && !navigator.language.toLowerCase().startsWith('zh')) {
            localStorage.setItem('soundlink-lang', 'en');
            location.replace('/SoundLink/en/');
          }
        } catch (e) {}
      })();
    </script>
