name: Deploy SoundLink Website

on:
  push:
    branches:
      - main


permissions:
  contents: read
  pages: write
  id-token: write


jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm


      - name: Install dependencies
        working-directory: website
        run: npm install


      - name: Build
        working-directory: website
        run: npm run build


      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./website/dist



  deploy:

    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages


    steps:

      - name: Deploy
        uses: actions/deploy-pages@v4