name: 功能建议 / Feature Request
description: 提出新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提建议前建议先看 [开发计划](https://github.com/KversKv/soundlink-oss/blob/main/docs/First/12-plan.md)与[后续优化清单](https://github.com/KversKv/soundlink-oss/blob/main/docs/NewFunctions/release-readiness/03-p2-future-optimizations.md)，避免与已规划项重复。

  - type: checkboxes
    id: preflight
    attributes:
      label: 前置确认
      options:
        - label: 我已搜索过现有 Issue 与规划文档，没有重复
          required: true
        - label: 我的建议不需要 root / 越狱 / 私有 API / 绕过 DRM
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 请描述实际使用场景，而不是直接给方案
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他做法

  - type: dropdown
    id: scope
    attributes:
      label: 涉及范围
      multiple: true
      options:
        - 桌面接收端
        - 桌面发送端
        - Android
        - iOS
        - 协议 / 共享层
        - 文档
    validations:
      required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意提交 PR 实现这个功能
